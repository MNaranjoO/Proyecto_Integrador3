<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Sistema de Notas y Asistencias</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Sistema de Notas y Asistencias</h1>
        <p>Acceso al sistema</p>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="consulta.html">Consulta de notas</a>
        <a href="login.html" class="activa">Iniciar sesión</a>
    </nav>

    <main>
        <section>
            <h2>Ingreso de Profesor</h2>
            <p>Inicia sesión con tu correo institucional para gestionar estudiantes, profesores, materias, matrículas, notas y asistencias.</p>

            <form class="formulario" action="estudiantes.html">
                <label for="correoProfesor">Correo:</label>
                <input type="email" id="correoProfesor" name="correoProfesor" placeholder="elena.cardenas@correo.com" required>

                <label for="claveProfesor">Contraseña:</label>
                <input type="password" id="claveProfesor" name="claveProfesor" placeholder="Ingresa tu contraseña" required>

                <button type="submit">Ingresar como profesor</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Sistema de Notas y Asistencias - 2026</p>
    </footer>

</body>

</html>
